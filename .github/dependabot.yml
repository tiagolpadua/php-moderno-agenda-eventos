# Dependabot: mantém as dependências atualizadas abrindo PRs automaticamente.
# Referência: https://docs.github.com/pt/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Pacotes PHP (composer.json / composer.lock)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencias"

  # Versões das actions usadas nos workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencias"
