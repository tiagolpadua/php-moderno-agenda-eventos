# Primeira Action: roda os testes a cada push na main e em todo pull request.
# Referência: https://docs.github.com/pt/actions/reference/workflows-and-actions/workflow-syntax
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes (PHPUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Verificar sintaxe dos arquivos PHP
        run: find src public tests templates -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Instalar dependências
        run: composer install --no-interaction --no-progress

      - name: Rodar os testes
        run: composer test
