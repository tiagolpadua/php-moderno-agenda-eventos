# Parâmetros FastCGI enviados ao PHP-FPM (viram o $_SERVER do PHP).
# Baseado no arquivo fastcgi_params que acompanha o NGINX.
# Referência: https://nginx.org/en/docs/http/ngx_http_fastcgi_module.html

fastcgi_pass agenda_app;

# Todo pedido é atendido pelo front controller (como no Laravel).
# O caminho é o de DENTRO do container da aplicação.
fastcgi_param  SCRIPT_FILENAME    /app/public/index.php;
fastcgi_param  SCRIPT_NAME        /index.php;
fastcgi_param  DOCUMENT_ROOT      /app/public;

# $uri já considera um eventual "rewrite" (ex.: /api/v1/ → /api/)
fastcgi_param  REQUEST_URI        $uri$is_args$args;
fastcgi_param  DOCUMENT_URI       $uri;
fastcgi_param  QUERY_STRING       $query_string;
fastcgi_param  REQUEST_METHOD     $request_method;
fastcgi_param  CONTENT_TYPE       $content_type;
fastcgi_param  CONTENT_LENGTH     $content_length;

fastcgi_param  SERVER_PROTOCOL    $server_protocol;
fastcgi_param  REQUEST_SCHEME     $scheme;
fastcgi_param  HTTPS              $https if_not_empty;
fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
fastcgi_param  SERVER_SOFTWARE    nginx;

fastcgi_param  REMOTE_ADDR        $remote_addr;
fastcgi_param  REMOTE_PORT        $remote_port;
fastcgi_param  SERVER_ADDR        $server_addr;
fastcgi_param  SERVER_PORT        $server_port;
fastcgi_param  SERVER_NAME        $server_name;
fastcgi_param  HTTP_X_REQUEST_ID  $request_id;

# Exigido pelo PHP compilado com --enable-force-cgi-redirect
fastcgi_param  REDIRECT_STATUS    200;
