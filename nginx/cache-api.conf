# Microcache das respostas da API (GET/HEAD com status 200 por 10 segundos).
# Referência: https://nginx.org/en/docs/http/ngx_http_fastcgi_module.html#fastcgi_cache

fastcgi_cache agenda_cache;
fastcgi_cache_valid 200 10s;
fastcgi_cache_lock on;                                  # só 1 requisição vai ao PHP quando o cache expira
fastcgi_cache_use_stale error timeout updating http_500 http_503;  # serve a versão antiga se o PHP cair
fastcgi_cache_background_update on;
