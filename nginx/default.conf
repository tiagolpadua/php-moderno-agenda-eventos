# NGINX da Agenda de Eventos: servidor web, proxy reverso, load balancer e API gateway.
# Este arquivo é incluído dentro do bloco "http" do nginx.conf da imagem oficial.
# Documentação: https://nginx.org/en/docs/

# DNS interno do Docker: o NGINX acompanha réplicas que sobem e descem.
resolver 127.0.0.11 valid=10s ipv6=off;

# Log que mostra QUAL réplica atendeu cada requisição e quanto tempo levou.
log_format balanceamento '$remote_addr "$request" $status '
                         'upstream=$upstream_addr tempo=${request_time}s';

# API gateway: até 10 requisições/segundo por IP (com rajadas de até 20).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

# Grupo de servidores da aplicação (load balancer).
# "app" é o nome do serviço no Compose. Com várias réplicas, o DNS devolve
# um IP por réplica e o NGINX distribui as requisições entre eles (round-robin).
upstream agenda_app {
    zone agenda_app 64k;            # memória compartilhada (necessária para "resolve")
    server app:8000 resolve;        # reavalia o DNS: novas réplicas entram sozinhas
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log balanceamento;

    # Cabeçalhos repassados para a aplicação (proxy reverso).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    # Se uma réplica não responder, tenta a próxima (failover).
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503;

    # Cabeçalhos devolvidos ao cliente (úteis para depurar).
    add_header X-Request-ID $request_id always;
    add_header X-Upstream   $upstream_addr always;

    # ---------------------------------------------------------------
    # 1. Servidor web: arquivos estáticos servidos direto pelo NGINX
    #    (a aplicação PHP nem fica sabendo dessas requisições)
    # ---------------------------------------------------------------
    location /css/ {
        root /var/www/public;
        expires 1h;
        access_log off;
    }

    # ---------------------------------------------------------------
    # 2. API gateway
    # ---------------------------------------------------------------
    # Rota pública versionada: /api/v1/eventos  →  /api/eventos na aplicação
    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://agenda_app/api/;
    }

    # Rota interna também passa pelo limite
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://agenda_app;
    }

    # Respostas de erro do gateway em JSON
    error_page 429 = @muitas_requisicoes;
    location @muitas_requisicoes {
        default_type application/json;
        return 429 '{"erro": "Muitas requisições. Tente novamente em instantes."}\n';
    }

    error_page 502 503 504 = @indisponivel;
    location @indisponivel {
        default_type application/json;
        return 503 '{"erro": "Serviço temporariamente indisponível."}\n';
    }

    # Saúde do próprio NGINX (não depende da aplicação)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------
    # 3. Proxy reverso: todo o resto vai para a aplicação
    # ---------------------------------------------------------------
    location / {
        proxy_pass http://agenda_app;
    }
}
