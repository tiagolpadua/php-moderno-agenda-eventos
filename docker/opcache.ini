; OPcache: guarda o bytecode PHP já compilado em memória.
; Referência: https://www.php.net/manual/pt_BR/opcache.configuration.php
opcache.enable=1
opcache.memory_consumption=64
opcache.max_accelerated_files=4000
; Em container o código não muda depois do build: não precisa verificar os arquivos a cada requisição.
opcache.validate_timestamps=0
