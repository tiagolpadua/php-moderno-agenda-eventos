; Configuração do pool PHP-FPM da Agenda de Eventos.
; Complementa os arquivos da imagem oficial (que já definem listen = 9000 e clear_env = no).
; Referência: https://www.php.net/manual/pt_BR/install.fpm.configuration.php

[www]
; Gerenciamento de processos: começa com poucos e cresce sob demanda.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Recicla cada processo depois de N requisições (evita vazamentos de memória).
pm.max_requests = 500

; Rotas internas do FPM para monitoração (acessíveis só via FastCGI, não pela internet).
ping.path = /ping
pm.status_path = /status
